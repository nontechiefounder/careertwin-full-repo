# workBYLiNE Docker Compose
version: "3.9"

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3004:3000"
    env_file:
      - apps/web/.env.local
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/employer"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

