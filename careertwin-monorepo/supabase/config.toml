# Local Supabase Project Configuration Scaffold
# Target Staging Operational Baseline (Step 4B5.2-D1)

project_id = "careertwin-local-baseline"

[api]
enabled = true
port = 54331
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54332
shadow_port = 54330
major_version = 15

[db.pooler]
enabled = false

[studio]
enabled = true
port = 54333

[inbucket]
enabled = true
port = 54335

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["https://127.0.0.1:3000"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
