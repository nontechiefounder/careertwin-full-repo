    education: B.S. Computer Science, Western Plains University, 2020
    work_sample:
      title: Idempotent ingestion recovery design
      body:
        - Each uploaded document receives a tenant-scoped idempotency key before a queue message is published.
        - Database state and the outbox event commit in one transaction.
        - Workers compare the expected workflow version before writing an immutable stage artifact.
        - Transient failures retry with exponential backoff; exhausted failures enter a reviewable dead-letter state.
        - The rollout reduced duplicates from 2.8 percent to 0.08 percent over eight weeks.

